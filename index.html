<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Duck Quiz Adventure</title>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="app">
        <header class="header">
            <h1>🧠 Knowledge Quiz</h1>
            <p>Test your general knowledge</p>
        </header>

        <div class="card">
            <div class="top-bar">
                <span id="progress">Question 1 / 5</span>
                <span id="score">Score: 0</span>
            </div>
    
            <h2 id="question">Question text</h2>
            <div id="answers" class="answers"></div>
            <div id="inlineDuckContainer" class="inline-duck-container">
                <img src="feedbackduck.gif" class="inline-duck-gif" alt="Duck Feedback">
                <span id="inlineFeedbackText" class="inline-feedback-text"></span>
            </div>

            <div id="finalDuckContainer" class="final-duck-card-container">
                <img src="dancingduck.gif" alt="Dancing Duck">
            </div>
            <button id="nextBtn">Next Question ➜</button>
        </div>

        <footer>
            <p style="color: white; margin-top: 20px;">Built for Fun</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
